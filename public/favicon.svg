<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D78B"/>
      <stop offset="50%" stop-color="#D6A84F"/>
      <stop offset="100%" stop-color="#9C722B"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E243B"/>
      <stop offset="100%" stop-color="#061522"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield / Tile -->
  <rect width="64" height="64" rx="14" fill="url(#darkBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#D6A84F" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Interlocking AN Monogram -->
  <!-- A Left Leg & Apex -->
  <path d="M14 47 L25.5 17 Q26.5 14 29 14 L30 14 Q32.5 14 33.5 17 L38 27" 
        stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- A Crossbar seamlessly interlocking into N Diagonal -->
  <path d="M21 34 L38 34" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- N Component extending from A's right to create N diagonal and right upward pillar -->
  <path d="M34 18 L34 47 M34 26 L48 44 Q49.5 46 51 44 L51 15" 
        stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent dot/diamond of growth -->
  <polygon points="51,11 53.5,13.5 51,16 48.5,13.5" fill="#F3D78B" />
</svg>
